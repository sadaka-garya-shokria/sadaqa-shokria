</head>

<body>

<div class="container">

<h1>🌿 صدقة جارية 🌿</h1>

<h2>على روح المرحومة بإذن الله</h2>

<h3>الحاجة/شكرية حامد محمود</h3>

<hr>

<h2>🤲 دعاء للمرحومة</h2>

<p>
اللهم ارحم الحاجة شكرية حامد محمود واغفر لها،
واجعل قبرها روضة من رياض الجنة،

اللهم آنس وحشتها ونوّر قبرها واجعلها من أهل الفردوس الأعلى.
  <div class="dua-box">
<h2>🤲 دعاء اليوم</h2>

<p id="dailyDua"></p>
<hr>

<h2>📿 عداد التسبيح</h2>

<p id="count">0</p>

<button onclick="increaseTasbeeh()">سبحان الله</button>

<button onclick="resetTasbeeh()">تصفير</button>

<script>
let count = 0;

function increaseTasbeeh(){
count++;
document.getElementById("count").innerHTML = count;
}

function resetTasbeeh(){
count = 0;
document.getElementById("count").innerHTML = count;
}
</script>
</div>

<script>
const duas = [
"اللهم ارحمها واغفر لها واجعل قبرها روضة من رياض الجنة.",
"اللهم آنس وحشتها ونور قبرها وارفع درجتها في المهديين.",
"اللهم اجعل القرآن شفيعًا لها ونورًا في قبرها.",
"اللهم أسكنها الفردوس الأعلى من الجنة بلا حساب ولا عذاب.",
"اللهم اجزها عنّا خير الجزاء واجمعنا بها في جنات النعيم."
];

let today = new Date().getDate();
document.getElementById("dailyDua").innerHTML =
duas[today % duas.length];
</script>
</p>
